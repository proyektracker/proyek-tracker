  pencsheet:id=>{FM.pn_ket='';FM.pn_jml='';S.kas.filter(k=>k.pid===id).forEach(k=>{FM['pe_'+k.id]=k.jml});SHEET={t:'penc',pid:id};draw()},
  delpe:id=>{if(arm['delpe'+id]){delete arm['delpe'+id];S.kas=S.kas.filter(k=>k.id!==id);delete FM['pe_'+id];save();draw();toast('Pencairan dihapus.')}else{arm['delpe'+id]=1;toast('Ketuk ikon sampah sekali lagi untuk menghapus.')}},
  pencsave:()=>{const pid=SHEET.pid,L=S.kas.filter(k=>k.pid===pid);if(L.some(k=>!(+FM['pe_'+k.id]>0)))return toast('Jumlah pencairan harus lebih dari 0. Hapus baris yang tidak dipakai.');
    L.forEach(k=>{k.jml=+FM['pe_'+k.id]});const nj=+FM.pn_jml||0;if(nj>0)S.kas.push({id:uid(),pid,tgl:today(),ket:(FM.pn_ket||'').trim()||'Pencairan',jml:nj,ref:'',ts:Date.now()});
    save();SHEET=null;draw();toast('Pencairan tersimpan.')},
  kaspage:()=>go('kas'),
  addsub:()=>{FM.sname='';SHEET={t:'subadd',cat:FM.kat,from:'add'};draw()},
  addsub2:id=>{FM.sname='';SHEET={t:'subadd',cat:KAT[+id]};draw()},
  editsub:id=>{const a=id.split('|'),cat=KAT[+a[0]],old=subs(cat)[+a[1]];FM.sname=old;SHEET={t:'subedit',cat,old};draw()},
  subsave:()=>{const n=(FM.sname||'').trim();if(!n)return toast('Isi nama jenis.');const L=subs(SHEET.cat),dup=L.some(x=>x.toLowerCase()===n.toLowerCase()&&x!==SHEET.old);if(dup)return toast('Nama jenis itu sudah ada.');
    if(SHEET.t==='subadd'){L.push(n);if(SHEET.from==='add')FM.sub=n}else{const o=SHEET.old;L[L.indexOf(o)]=n;S.items.forEach(i=>{if(i.kat===SHEET.cat&&i.sub===o)i.sub=n});if(FM.sub===o)FM.sub=n}
    save();SHEET=null;draw();toast('Jenis tersimpan.')},
  subdel:(id,t)=>{if(armed(t,'subdel','Yakin? Tekan lagi untuk menghapus')){const o=SHEET.old,L=subs(SHEET.cat);L.splice(L.indexOf(o),1);S.items.forEach(i=>{if(i.kat===SHEET.cat&&i.sub===o)i.sub=''});if(FM.sub===o)FM.sub='';save();SHEET=null;draw();toast('Jenis dihapus. Catatan lama menjadi tanpa jenis.')}},
  np:()=>openJobForm(),
  ej:id=>openJobForm(id),
  dj:(id,t)=>{if(armed(t,'dj'+id,'Yakin? Semua transaksi pekerjaan ikut terhapus')){S.items.filter(i=>i.pid===id&&i.foto).forEach(i=>{if(HASDB)dbDel(i.id).catch(()=>{})});S.projects=S.projects.filter(p=>p.id!==id);S.items=S.items.filter(i=>i.pid!==id);S.kas=S.kas.filter(i=>i.pid!==id);save();go('jobs',{},false,true)}},
  sj:id=>saveJob(id==='draft'),
  openjob:id=>{G.dc='';G.df='';G.dt='';go('detail',{id})},
  ad:id=>openAdd(id),
  mode:id=>{FM.mode=id;draw()},
  kat:id=>setKat(KAT[+id]),
  today:()=>setF('tgl',today()),
  saveTx:()=>{saveTx()},
  delTx:(id,t)=>{if(armed(t,'dtx','Yakin hapus? Tekan lagi')){const k=ST.t==='k';if(!k&&HASDB)dbDel(ST.id).catch(()=>{});if(k)S.kas=S.kas.filter(i=>i.id!==ST.id);else S.items=S.items.filter(i=>i.id!==ST.id);save();toast('Catatan dihapus.');back()}},
  editi:id=>openAdd(null,'out',{t:'i',id}),editk:id=>openAdd(null,'in',{t:'k',id}),
  pickcam:()=>$('fcam')&&$('fcam').click(),pickgal:()=>$('fgal')&&$('fgal').click(),
  delphoto:()=>{PF=null;PFN='';PFD=true;const a=$('fa');if(a)a.innerHTML=fotoArea()},
  viewfoto:id=>{SHEET={t:'foto',k:id};draw()},
  filt:()=>{FM.f1=G.df;FM.f2=G.dt;SHEET={t:'filt'};draw()},
  applyfilt:()=>{G.df=FM.f1||'';G.dt=FM.f2||'';SHEET=null;draw()},
  resetfilt:()=>{G.df='';G.dt='';SHEET=null;draw()},
  chip:id=>{G.jf=id;draw()},
  dcat:id=>{G.dc=G.dc===KAT[+id]?'':KAT[+id];draw()},
  print:()=>{const p=P(G.rid)||S.projects[0];if(!p)return;$('pr').innerHTML=printRep(p);setTimeout(()=>{try{window.print()}catch(e){}},60)},
  xl:()=>{if(!S.projects.length)return toast('Belum ada data untuk diekspor.');if(typeof XLSX==='undefined')return toast('Pustaka Excel belum termuat (butuh internet). Pakai menu Data > Salin untuk Excel.');try{xl();toast('File Excel dibuat. Cek folder Unduhan.')}catch(e){toast('Ekspor gagal. Coba menu Data > Salin untuk Excel.')}},
  tsv:()=>{const p=P(G.rid)||S.projects[0];if(!p)return note('m','Belum ada data.','bad');const tx=ledgerSpec(p).tsv();$('bk').value=tx;try{navigator.clipboard.writeText(tx).catch(()=>{})}catch(e){}$('bk').select();note('m','Laporan proyek "'+p.nama+'" ada di kotak di atas (dan disalin). Tempel di sel A1 Excel / Google Sheets.','ok')},
  csv:()=>{const tx=csv();try{const u=URL.createObjectURL(new Blob([tx],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='pengeluaran-proyek.csv';document.body.appendChild(l);l.click();l.remove()}catch(e){}$('bk').value=tx;note('m','CSV dibuat. Jika unduhan tidak berjalan, salin teks di kotak di atas.','ok')},
  bk:()=>{$('bk').value=JSON.stringify(S);$('bk').select();note('m','Cadangan dibuat. Salin teks di atas.','ok')},
  rs:()=>{try{const p=JSON.parse($('bk').value);if(!p||!Array.isArray(p.projects)||!Array.isArray(p.items)||!Array.isArray(p.kas))throw 0;S=p;save();toast('Data dipulihkan.');go('home',{},false,true)}catch(e){note('m','Teks cadangan tidak valid.','bad')}},
  demo:(id,t)=>{if(!S.projects.length||armed(t,'demo','Timpa data saat ini? Tekan lagi')){demo();save();go('home',{},false,true)}},
  wipe:(id,t)=>{if(armed(t,'wipe','Yakin hapus semua? Tekan lagi')){S={projects:[],items:[],kas:[]};if(HASDB)indexedDB.deleteDatabase('kbp_foto');save();go('home',{},false,true)}},
  saveprof:()=>{PR={nama:(FM.pnama||'').trim(),jabatan:(FM.pjab||'').trim(),instansi:(FM.pinst||'').trim()};try{localStorage.setItem('kbp_prof',JSON.stringify(PR))}catch(e){}toast('Profil disimpan.')},
  ss:()=>{const u=(FM.s1||'').trim();if(u&&!/^https:\/\/script\.google\.com\//.test(u))return note('m2','Alamat harus diawali https://script.google.com/','bad');SY.url=u;SY.secret=(FM.s2||'').trim();SY.dirty=!!u;syS();syUI();note('m2',u?'Pengaturan disimpan. Tekan Sinkron sekarang untuk mencoba.':'Sinkron dimatikan.','ok')},
  sy:()=>{if(!SY.url)return note('m2','Isi alamat Web App dulu.','bad');note('m2','Menyinkron...','ok');syncNow().then(r=>note('m2',r.ok?'Berhasil: '+r.projects+' proyek terkirim ke Google Sheet.':'Gagal: '+r.error+'. Data aman di HP dan akan dicoba lagi otomatis.',r.ok?'ok':'bad'))},
  sl:(id,t)=>{if(!SY.url)return note('m2','Isi alamat Web App dulu.','bad');if(!armed(t,'sl','Yakin? Data di HP akan diganti. Tekan lagi'))return;note('m2','Mengambil data...','ok');
    fetch(SY.url+(SY.url.indexOf('?')<0?'?':'&')+'action=load&secret='+encodeURIComponent(SY.secret)).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Gagal');const d=j.data;if(!d||!Array.isArray(d.projects)||!Array.isArray(d.items)||!Array.isArray(d.kas))throw new Error('Belum ada data di Google Sheet');S=d;save();toast('Data dipulihkan dari Google Sheet.');go('home',{},false,true)}).catch(e=>{note('m2','Gagal: '+((e&&e.message)||e),'bad')})},
  paste:()=>{FM.ptxt='';CP=[];go('paste')},
  pv:()=>{CP=parse(FM.ptxt||'');if(!CP.length)return toast('Tulis minimal satu baris item.');draw()},
  sa:()=>{const okr=CP.filter(r=>r.ok);if(!okr.length)return;okr.forEach(r=>S.items.push({id:uid(),pid:FM.pid,tgl:FM.tgl||today(),nota:r.nota,toko:r.toko,kat:r.kat,sub:r.sub||'',ket:r.ket,qty:r.qty,sat:r.sat,harga:r.harga,foto:false,ts:Date.now()}));LASTP=FM.pid;CP=[];save();toast(okr.length+' pengeluaran tersimpan.');go('detail',{id:FM.pid},true)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){if(t.tagName==='A')return;f(t.dataset.id,t,e)}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
  if(f){FM[f]=t.value;if(f==='qty'||f==='harga'){const q=+FM.qty,h=+FM.harga;if(q>0&&h>0)setF('jml',Math.round(q*h*100)/100)}if(['kontrak','dp','buf','mulai','selesai'].includes(f))jobCalc()}
  if(t.id==='jq'){G.jq=t.value;$('jl').innerHTML=jlist()}});
document.addEventListener('change',e=>{const t=e.target,g=t.dataset.g;
  if(g){G[g]=t.value;draw();return}
  if(t.dataset.f==='ket'&&V==='add'&&!ST.id&&(FM.mode||'out')==='out'){
    const q=t.value.trim().toLowerCase(),m=q&&S.items.filter(i=>i.ket.toLowerCase()===q).pop();
    if(m){setKat(m.kat);FM.sub=m.sub||'';refreshSubs();if(!FM.toko)setF('toko',m.toko||'');setF('sat',m.sat||'');setF('harga',m.harga);if(!FM.qty)setF('qty',m.qty);if(!(+FM.jml>0))setF('jml',Math.round((+FM.qty||1)*m.harga*100)/100)}
    else{if(FM.kat===KAT[0])setKat(guess(t.value));const g=guessSub(FM.kat,t.value);if(g&&!FM.sub){FM.sub=g;refreshSubs()}}
  }
  if(t.id==='fcam'||t.id==='fgal'){const f=t.files&&t.files[0];if(f)takeFoto(f);t.value=''}
  if(t.dataset.cs!==undefined){const r=CP[+t.dataset.cs];r.kat=t.value;r.sub=guessSub(r.kat,r.ket);draw()}
  if(t.dataset.f==='pid'&&V==='report')G.rid=t.value;
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(x){}}
if(SY.url&&SY.dirty)setTimeout(()=>{syncNow()},1500);
addEventListener('online',()=>{if(SY.url&&SY.dirty)syncNow()});
try{history.replaceState({},'')}catch(e){}
draw();
</script>
</body>
</html>
